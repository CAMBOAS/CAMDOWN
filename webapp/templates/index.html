<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMDOWN</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div class="container py-5" style="max-width: 640px;">

      <div class="brand text-center mb-4">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="brand-logo">
        <h1 class="h4 mt-3 mb-1">CAMDOWN</h1>
        <p class="text-muted small mb-0">Facebook · YouTube · TikTok · Instagram · Pinterest</p>
      </div>

      <div class="card glass-card">
        <div class="card-body p-4 p-md-5">

          <form id="download-form">
            <div class="mb-3">
              <label for="url" class="form-label">Video URL</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i class="bi">🔗</i></span>
                <input type="text" class="form-control border-start-0 border-end-0" id="url"
                       placeholder="Paste a video link..." required>
                <button type="button" id="clear-url" class="btn btn-outline-secondary border-start-0" title="Clear">✕</button>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-8">
                <label for="output" class="form-label">Save to</label>
                <input type="text" class="form-control" id="output" value="{{ default_output }}">
                <div class="form-text">Auto-sorted into a subfolder per platform</div>
              </div>
              <div class="col-md-4">
                <label for="quality" class="form-label">Quality</label>
                <select id="quality" class="form-select">
                  {% for q in ["2160", "1080", "720", "480", "360"] %}
                  <option value="{{ q }}" {% if q == default_quality %}selected{% endif %}>{{ q }}p</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <button type="submit" id="download-btn" class="btn btn-primary btn-lg w-100 rounded-pill">
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
              <span id="btn-label">Download</span>
            </button>
          </form>

          <div class="progress mt-4">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
          </div>

          <label class="form-label mt-4 text-muted small text-uppercase">Activity Log</label>
          <pre id="log" class="log-box">Waiting for a link...</pre>

          <a id="save-file" href="#" download class="btn btn-success w-100 rounded-pill mt-3 d-none">
            ⬇ Save video to your device
          </a>
        </div>
      </div>

      <p class="text-center text-muted small mt-4">
        គាំទ្រ Facebook, YouTube, TikTok, Instagram និង Pinterest — សូមទាញយកតែវីឌេអូដែលអ្នកមានសិទ្ធិ ឬបានទទួលការអនុញ្ញាតប៉ុណ្ណោះ
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
